<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trenažér analytické geometrie</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #0f172a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #fbbf24;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.15);
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.15);
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 500px;
      padding: 25px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    h1 {
      color: var(--text);
      font-size: 1.6rem;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: var(--text-muted);
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .mode-btn {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 16px 20px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      margin: 10px 0;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .mode-btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    .streak-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .streak-star {
      font-size: 2.2rem;
      color: #334155;
      transition: color 0.3s ease, transform 0.3s ease;
    }

    .streak-star.active {
      color: var(--accent);
      transform: scale(1.2);
      filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.6));
    }

    .task-card {
      background: var(--card-inner);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 15px;
      font-size: 1.15rem;
      line-height: 1.5;
      margin-bottom: 20px;
      border-left: 5px solid var(--primary);
      text-align: left;
    }

    .input-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .coord-input {
      width: 80px;
      height: 52px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: bold;
      background-color: var(--card-inner);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: all 0.2s;
    }

    .coord-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
    }

    .btn-action {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn-action:hover {
      background-color: var(--primary-hover);
    }

    .btn-back {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 15px;
      text-decoration: underline;
    }

    .btn-back:hover {
      color: var(--text);
    }

    .feedback {
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .feedback.success {
      background-color: var(--success-bg);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .feedback.error {
      background-color: var(--danger-bg);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(5px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 99;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div class="container">
    <!-- MENU SELECTION -->
    <div id="screen-menu">
      <h1>📐 Trenažér Souřadnic</h1>
      <p class="subtitle">Vyber si režim tréninku. Cílem je získat 4 správné odpovědi v řadě!</p>
      <button class="mode-btn" onclick="startTrainer('rovnobeznik')">🔷 Rovnoběžníky (Streak 4)</button>
      <button class="mode-btn" onclick="startTrainer('stred')">📏 Střed úsečky (Streak 4)</button>
    </div>

    <!-- TRAINER SCREEN -->
    <div id="screen-trainer" class="hidden">
      <div class="streak-container">
        <span class="streak-star" id="star-1">★</span>
        <span class="streak-star" id="star-2">★</span>
        <span class="streak-star" id="star-3">★</span>
        <span class="streak-star" id="star-4">★</span>
      </div>

      <div class="task-card" id="task-text">
        Zadání příkladu...
      </div>

      <div class="input-row">
        <span id="target-label">D</span> = [
        <input type="text" inputmode="decimal" id="input-x" class="coord-input" placeholder="x" autocomplete="off">
        ;
        <input type="text" inputmode="decimal" id="input-y" class="coord-input" placeholder="y" autocomplete="off">
        ]
      </div>

      <button class="btn-action" id="btn-submit" onclick="checkAnswer()">Zkontrolovat</button>
      <button class="btn-action hidden" id="btn-next" onclick="nextQuestion()">Další příklad ➔</button>

      <div id="feedback" class="feedback"></div>

      <button class="btn-back" onclick="showMenu()">← Zpět do nabídky</button>
    </div>
  </div>

      <button class="mode-btn" onclick="closeCelebration()">Pokračovat v tréninku</button>
    </div>
  </div>

      { zadani: "Je dán bod U[-5; 3] a střed S[-2; 0]. Najdi bod V tak, aby S byl středem úsečky UV.", label: "V", res: [1, -3] },
      { zadani: "Je dán bod X[3; -2] a střed S[0; -1]. Najdi bod Y tak, aby S byl středem úsečky XY.", label: "Y", res: [-3, 0] },
      { zadani: "Je dán bod A[-4; -1] a střed S[-1; 2]. Najdi bod B tak, aby S byl středem úsečky AB.", label: "B", res: [2, 5] },
      { zadani: "Je dán bod K[1; -4] a střed S[-2; -1]. Najdi bod L tak, aby S byl středem úsečky KL.", label: "L", res: [-5, 2] },
      { zadani: "Je dán bod P[-6; 2] a střed S[-3; -1]. Najdi bod Q tak, aby S byl středem úsečky PQ.", label: "Q", res: [0, -4] },
      { zadani: "Je dán bod C[-2; -5] a střed S[1; -2]. Najdi bod D tak, aby S byl středem úsečky CD.", label: "D", res: [4, 1] },
      { zadani: "Je dán bod E[5; -1] a střed S[1; 2]. Najdi bod F tak, aby S byl středem úsečky EF.", label: "F", res: [-3, 5] },
      { zadani: "Je dán bod M[-3; 4] a střed S[0; 1]. Najdi bod N tak, aby S byl středem úsečky MN.", label: "N", res: [3, -2] },
      { zadani: "Je dán bod U[-4; -3] a střed S[-1; 0]. Najdi bod V tak, aby S byl středem úsečky UV.", label: "V", res: [2, 3] },
      { zadani: "Je dán bod X[2; -5] a střed S[-1; -2]. Najdi bod Y tak, aby S byl středem úsečky XY.", label: "Y", res: [-4, 1] },
      { zadani: "Je dán bod A[-5; 3] a střed S[-1; -1]. Najdi bod B tak, aby S byl středem úsečky AB.", label: "B", res: [3, -5] }
    ];

    // STAV APLIKACE
    let currentMode = '';
    let streak = 0;
    let currentTask = null;
    let stredToggle = true;

    function showMenu() {
      document.getElementById('screen-menu').classList.remove('hidden');
      document.getElementById('screen-trainer').classList.add('hidden');
    }

    function startTrainer(mode) {
      currentMode = mode;
      streak = 0;
      stredToggle = Math.random() < 0.5;
      updateStreakStars();

      document.getElementById('screen-menu').classList.add('hidden');
      document.getElementById('screen-trainer').classList.remove('hidden');

      nextQuestion();
    }

    function updateStreakStars() {
      for (let i = 1; i <= 4; i++) {
        const star = document.getElementById(`star-${i}`);
        if (i <= streak) {
          star.classList.add('active');
        } else {
          star.classList.remove('active');
        }
      }
    }

    function getRandomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function nextQuestion() {
      document.getElementById('input-x').value = '';
      document.getElementById('input-y').value = '';
      document.getElementById('input-x').disabled = false;
      document.getElementById('input-y').disabled = false;
      document.getElementById('feedback').style.display = 'none';
      document.getElementById('btn-submit').classList.remove('hidden');
      document.getElementById('btn-next').classList.add('hidden');

      if (currentMode === 'rovnobeznik') {
        currentTask = getRandomItem(dataRovnobezniky);
      } else {
        if (stredToggle) {
          currentTask = getRandomItem(dataStredAB);
        } else {
          currentTask = getRandomItem(dataStredAS);
        }
        stredToggle = !stredToggle;
      }

      document.getElementById('task-text').innerHTML = currentTask.zadani;
      document.getElementById('target-label').innerText = currentTask.label;

      document.getElementById('input-x').focus();
    }

    function checkAnswer() {
      const rawX = document.getElementById('input-x').value.trim().replace(',', '.');
      const rawY = document.getElementById('input-y').value.trim().replace(',', '.');

      if (rawX === '' || rawY === '') {
        alert('Vyplň prosím obě souřadnice!');
        return;
      }

      const valX = parseFloat(rawX);
      const valY = parseFloat(rawY);

      const targetX = currentTask.res[0];
      const targetY = currentTask.res[1];

      const feedback = document.getElementById('feedback');
      feedback.style.display = 'block';

      if (valX === targetX && valY === targetY) {
        // SPRÁVNĚ!
        streak++;
        updateStreakStars();

        feedback.className = 'feedback success';
        feedback.innerText = '✨ Výborně! Správná odpověď.';

        document.getElementById('input-x').disabled = true;
        document.getElementById('input-y').disabled = true;
        document.getElementById('btn-submit').classList.add('hidden');

        if (streak >= 4) {
          setTimeout(triggerCelebration, 400);
        } else {
          launchMiniConfetti();
          document.getElementById('btn-next').classList.remove('hidden');
        }
      } else {
        // ŠPATNĚ
        streak = 0;
        updateStreakStars();

        feedback.className = 'feedback error';
        feedback.innerText = `Chyba! Správný výsledek je ${currentTask.label}[${targetX}; ${targetY}].`;

        document.getElementById('input-x').disabled = true;
        document.getElementById('input-y').disabled = true;
        document.getElementById('btn-submit').classList.add('hidden');
        document.getElementById('btn-next').classList.remove('hidden');
      }
    }

    document.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        const btnSubmit = document.getElementById('btn-submit');
        const btnNext = document.getElementById('btn-next');

        if (!btnSubmit.classList.contains('hidden')) {
          checkAnswer();
        } else if (!btnNext.classList.contains('hidden')) {
          nextQuestion();
        }
      }
    });

    function triggerCelebration() {
      document.getElementById('modal-celebration').style.display = 'flex';
      launchBigConfetti();
    }

    function closeCelebration() {
      document.getElementById('modal-celebration').style.display = 'none';
      streak = 0;
      updateStreakStars();
      nextQuestion();
    }

    function launchMiniConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#6366f1', '#fbbf24', '#38bdf8', '#f43f5e', '#a855f7'];

      for (let i = 0; i < 35; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2 + 50,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.7) * 10,
          size: Math.random() * 6 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          gravity: 0.3,
          rotation: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 10
        });
      }

      function renderMini() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let stillActive = false;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.rotation += p.vRot;

          if (p.y < canvas.height) stillActive = true;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });

        if (stillActive) {
          requestAnimationFrame(renderMini);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      renderMini();
    }

    function launchBigConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#6366f1', '#fbbf24', '#38bdf8', '#f43f5e', '#a855f7', '#22c55e', '#e11d48'];

      for (let i = 0; i < 160; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 20,
          vy: (Math.random() - 0.7) * 20,
          size: Math.random() * 9 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          gravity: 0.25,
          rotation: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 12
        });
      }

      function renderBig() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let stillActive = false;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.rotation += p.vRot;

          if (p.y < canvas.height) stillActive = true;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });

        if (stillActive && document.getElementById('modal-celebration').style.display === 'flex') {
          requestAnimationFrame(renderBig);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      renderBig();
    }
  </script>
