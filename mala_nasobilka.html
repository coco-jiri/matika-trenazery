<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trenažér malé násobilky</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Tmavé pozadí s přechodem */
        body {
            background-color: #0f172a;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Čisté CSS animace pro bleskový záblesk pozadí */
        .flash-success {
            animation: flashGreen 0.4s ease-out forwards;
        }

        .flash-error {
            animation: flashRed 0.4s ease-out forwards;
        }

        @keyframes flashGreen {
            0% { background-color: #0f172a; }
            50% { background-color: #064e3b; }
            100% { background-color: #0f172a; }
        }

        @keyframes flashRed {
            0% { background-color: #0f172a; }
            30% { background-color: #7f1d1d; }
            100% { background-color: #0f172a; }
        }

        /* Shake animace pro chybnou odpověď */
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Odstranění šipek z input type="number" */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body id="body" class="text-slate-100 flex flex-col justify-between items-center p-4 md:p-6 min-h-screen">

    <!-- Záhlaví -->
    <header class="w-full max-w-md flex justify-between items-center mb-4">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-display font-extrabold text-xl shadow-lg shadow-indigo-500/20">
                ×
            </div>
            <div>
                <h1 class="font-display text-lg font-bold tracking-wide leading-tight">Násobilka</h1>
                <p class="text-xs text-slate-400">Cíl: 10 příkladů v řadě za sebou</p>
            </div>
        </div>

        <!-- Tlačítko pro zapnutí/vypnutí zvuku -->
        <button id="soundToggle" class="p-2.5 rounded-xl glass-card text-slate-300 hover:text-white hover:bg-white/10 transition">
            <svg id="soundOnIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
            <svg id="soundOffIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" /></svg>
        </button>
    </header>

    <!-- Hlavní kontejner -->
    <main class="w-full max-w-md my-auto flex flex-col gap-5">

        <!-- Karta s Pokrokem a Tečkami Streaku -->
        <div class="glass-card rounded-2xl p-4 shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Série (Streak)</span>
                <span id="streakCounter" class="font-display font-extrabold text-amber-400 text-lg">0 / 10 🔥</span>
            </div>
            <!-- Progress Bar -->
            <div class="w-full h-2.5 bg-slate-900/80 rounded-full overflow-hidden p-0.5 border border-slate-700/50 mb-3">
                <div id="progressBar" class="h-full bg-gradient-to-r from-amber-500 via-orange-500 to-emerald-400 rounded-full w-0 transition-all duration-300 ease-out"></div>
            </div>
            <!-- 10 Indikátorů / Teček -->
            <div id="dotsContainer" class="flex justify-between items-center px-1">
                <!-- Generuje JS -->
            </div>
        </div>

        <!-- Hlavní hrací karta -->
        <div id="gameCard" class="glass-card rounded-3xl p-6 md:p-8 shadow-2xl relative overflow-hidden transition-transform duration-200">
            
            <!-- Zobrazení Příkladů -->
            <div class="text-center my-2">
                <div class="text-slate-400 text-sm font-medium mb-2">Vypočítej:</div>
                <div id="problemDisplay" class="font-display text-5xl md:text-6xl font-extrabold tracking-tight text-white mb-6">
                    <span id="numA">?</span> <span class="text-indigo-400">×</span> <span id="numB">?</span> =
                </div>
            </div>

            <!-- Formulář s Nativním Inputem pro Klávesnici -->
            <form id="answerForm" onsubmit="event.preventDefault(); submitAnswer();" class="mt-2">
                <div class="flex flex-col gap-4 max-w-xs mx-auto">
                    <input 
                        type="number" 
                        id="answerInput" 
                        placeholder="?" 
                        autocomplete="off"
                        inputmode="numeric"
                        autofocus
                        class="w-full text-center text-5xl font-display font-bold py-3 px-4 bg-slate-900/90 border-2 border-indigo-500/50 rounded-2xl focus:border-indigo-400 focus:outline-none focus:ring-4 focus:ring-indigo-500/20 text-white placeholder-slate-600 transition shadow-inner"
                    />
                    <button 
                        type="submit" 
                        id="submitBtn"
                        class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold text-lg shadow-lg shadow-indigo-500/25 active:scale-95 transition-all flex items-center justify-center gap-2">
                        <span>Potvrdit (Enter)</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </form>

            <!-- Feedback / Chybová zpráva -->
            <div id="feedbackMessage" class="min-h-[2rem] mt-4 text-center flex items-center justify-center font-semibold text-sm">
                <span class="text-slate-400">Zadej číslo a stiskni Enter</span>
            </div>
        </div>

    </main>

    <!-- Statistiky v patce -->
    <footer class="w-full max-w-md mt-4 text-center text-xs text-slate-400 flex justify-around p-3 glass-card rounded-xl">
        <div>Celkem správně: <span id="statCorrect" class="font-bold text-emerald-400">0</span></div>
        <div>Chyb: <span id="statMistakes" class="font-bold text-rose-400">0</span></div>
        <div>Nejlepší Streak: <span id="statBestStreak" class="font-bold text-amber-400">0</span></div>
    </footer>

    <!-- Gratulační Modal (Výhra) -->
    <div id="winModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="glass-card bg-slate-900/90 border border-emerald-500/30 rounded-3xl p-6 md:p-8 max-w-sm w-full text-center shadow-2xl transform scale-90 transition-transform duration-300" id="winModalCard">
            <div class="w-20 h-20 bg-emerald-500/20 border-2 border-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl shadow-lg shadow-emerald-500/20">
                🏆
            </div>
            <h2 class="font-display text-3xl font-extrabold text-white mb-2">Skvělá práce!</h2>
            <p class="text-slate-300 text-sm mb-6">Dosáhl/a jsi cílového streaku <strong>10 správných odpovědí</strong> v řadě!</p>

            <button onclick="resetGame(true)" class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-extrabold text-lg shadow-lg shadow-emerald-500/30 active:scale-95 transition">
                Hrát znovu 🚀
            </button>
        </div>
    </div>

    <!-- JavaScript Logika -->
    <script>
        const TARGET_STREAK = 10;
        let currentStreak = 0;
        let numA = 0;
        let numB = 0;
        let correctAnswer = 0;
        let soundEnabled = true;

        // Statistiky
        let stats = {
            correct: 0,
            mistakes: 0,
            bestStreak: 0
        };

        // Elementy DOM
        const body = document.getElementById('body');
        const numAEl = document.getElementById('numA');
        const numBEl = document.getElementById('numB');
        const answerInput = document.getElementById('answerInput');
        const streakCounter = document.getElementById('streakCounter');
        const progressBar = document.getElementById('progressBar');
        const dotsContainer = document.getElementById('dotsContainer');
        const feedbackMessage = document.getElementById('feedbackMessage');
        const gameCard = document.getElementById('gameCard');
        const winModal = document.getElementById('winModal');
        const winModalCard = document.getElementById('winModalCard');
        
        const statCorrect = document.getElementById('statCorrect');
        const statMistakes = document.getElementById('statMistakes');
        const statBestStreak = document.getElementById('statBestStreak');

        // Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15); // G5
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'win') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const noteOsc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    noteOsc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);
                    noteOsc.type = 'triangle';
                    noteOsc.frequency.setValueAtTime(freq, now + index * 0.1);
                    noteGain.gain.setValueAtTime(0.2, now + index * 0.1);
                    noteGain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.3);
                    noteOsc.start(now + index * 0.1);
                    noteOsc.stop(now + index * 0.1 + 0.3);
                });
            }
        }

        // Přepínač zvuku
        document.getElementById('soundToggle').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            document.getElementById('soundOnIcon').classList.toggle('hidden', !soundEnabled);
            document.getElementById('soundOffIcon').classList.toggle('hidden', soundEnabled);
            focusInput();
        });

        // Inicializace 10 teček
        function initDots() {
            dotsContainer.innerHTML = '';
            for (let i = 0; i < TARGET_STREAK; i++) {
                const dot = document.createElement('div');
                dot.className = 'w-3 h-3 rounded-full border border-slate-600 bg-slate-800 transition-all duration-300';
                dotsContainer.appendChild(dot);
            }
        }

        // Generování nového příkladu
        function generateProblem() {
            numA = Math.floor(Math.random() * 9) + 2; // 2 až 10
            numB = Math.floor(Math.random() * 9) + 2; // 2 až 10
            correctAnswer = numA * numB;

            numAEl.textContent = numA;
            numBEl.textContent = numB;
            answerInput.value = '';
            focusInput();
        }

        // Automatický focus na input
        function focusInput() {
            setTimeout(() => {
                answerInput.focus();
            }, 10);
        }

        // Vyhodnocení odpovědi
        function submitAnswer() {
            const val = answerInput.value.trim();
            if (val === '') return;

            const userAnswer = parseInt(val, 10);

            if (userAnswer === correctAnswer) {
                handleCorrectAnswer();
            } else {
                handleWrongAnswer();
            }
        }

        // Správná odpověď
        function handleCorrectAnswer() {
            playSound('correct');
            currentStreak++;
            stats.correct++;
            
            if (currentStreak > stats.bestStreak) {
                stats.bestStreak = currentStreak;
            }

            triggerFlash('flash-success');
            showFeedback('Správně! ✨', 'text-emerald-400');
            
            updateUI();

            if (currentStreak >= TARGET_STREAK) {
                setTimeout(triggerWin, 250);
            } else {
                generateProblem();
            }
        }

        // Chybná odpověď
        function handleWrongAnswer() {
            playSound('wrong');
            stats.mistakes++;
            
            showFeedback(`Chyba! ${numA} × ${numB} = <strong class="text-rose-400 text-base ml-1">${correctAnswer}</strong>`, 'text-rose-400');
            
            // Shake efekt karty
            gameCard.classList.remove('animate-shake');
            void gameCard.offsetWidth; // Reflow
            gameCard.classList.add('animate-shake');

            triggerFlash('flash-error');

            currentStreak = 0;
            updateUI();
            
            answerInput.value = '';
            focusInput();
        }

        // Krátký záblesk pozadí přes CSS Animaci
        function triggerFlash(className) {
            body.classList.remove('flash-success', 'flash-error');
            void body.offsetWidth; // Reflow
            body.classList.add(className);

            setTimeout(() => {
                body.classList.remove(className);
            }, 450);
        }

        // Aktualizace UI
        function updateUI() {
            streakCounter.textContent = `${currentStreak} / ${TARGET_STREAK} 🔥`;
            
            const percentage = (currentStreak / TARGET_STREAK) * 100;
            progressBar.style.width = `${percentage}%`;

            // Aktualizace indikátorů
            const dots = dotsContainer.children;
            for (let i = 0; i < TARGET_STREAK; i++) {
                if (i < currentStreak) {
                    dots[i].className = 'w-3 h-3 rounded-full bg-emerald-400 shadow-md shadow-emerald-400/50 border border-emerald-300 scale-110 transition-all duration-300';
                } else {
                    dots[i].className = 'w-3 h-3 rounded-full border border-slate-600 bg-slate-800 transition-all duration-300';
                }
            }

            // Statistiky
            statCorrect.textContent = stats.correct;
            statMistakes.textContent = stats.mistakes;
            statBestStreak.textContent = stats.bestStreak;
        }

        function showFeedback(text, colorClass) {
            feedbackMessage.innerHTML = `<span class="${colorClass}">${text}</span>`;
        }

        // Vítězná obrazovka
        function triggerWin() {
            playSound('win');

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }

            winModal.classList.remove('hidden');
            setTimeout(() => {
                winModal.classList.remove('opacity-0');
                winModalCard.classList.remove('scale-90');
                winModalCard.classList.add('scale-100');
            }, 10);
        }

        // Reset hry
        function resetGame(fullReset = false) {
            currentStreak = 0;
            if (fullReset) {
                winModal.classList.add('opacity-0');
                winModalCard.classList.remove('scale-100');
                winModalCard.classList.add('scale-90');
                setTimeout(() => {
                    winModal.classList.add('hidden');
                }, 300);
            }

            showFeedback('Zadej číslo a stiskni Enter', 'text-slate-400');
            updateUI();
            generateProblem();
        }

        // Udržení focusu na inputu při kliknutí na stránce
        document.addEventListener('click', (e) => {
            if (!e.target.closest('button') && winModal.classList.contains('hidden')) {
                focusInput();
            }
        });

        window.onload = () => {
            initDots();
            resetGame();
        };
    </script>
</body>
</html>
