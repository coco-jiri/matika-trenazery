<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trenažér zlomků</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    }

            }

    <style>
        /* Tmavé pozadí s přechodem */
        body {
            background-color: #0f172a;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Čisté CSS animace pro bleskový záblesk pozadí */
        .flash-success {
            animation: flashGreen 0.4s ease-out forwards;
        }

        .flash-error {
            animation: flashRed 0.4s ease-out forwards;
        }

        @keyframes flashGreen {
            0% { background-color: #0f172a; }
            50% { background-color: #064e3b; }
            100% { background-color: #0f172a; }
        }

        @keyframes flashRed {
            0% { background-color: #0f172a; }
            30% { background-color: #7f1d1d; }
            100% { background-color: #0f172a; }
        }

        /* Shake animace pro chybnou odpověď */
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Odstranění šipek z input type="number" */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Vzhled zlomkové čáry */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            padding: 0 4px;
        }
        .fraction-num {
            border-bottom: 3px solid currentColor;
            padding-bottom: 2px;
            line-height: 1.1;
        }
        .fraction-den {
            padding-top: 2px;
            line-height: 1.1;
        }
    </style>
</head>

    <!-- Záhlaví s výběrem operace -->
    <header class="w-full max-w-md flex flex-col gap-3 mb-2">
        <div class="flex justify-between items-center">
            <div class="flex items-center space-x-3">

                    +
                </div>
                <div>

                    <p class="text-xs text-slate-400">Cíl: <span id="targetStreakText" class="font-bold text-amber-400">5</span> v řadě za sebou</p>
                </div>
            </div>

            <!-- Tlačítko pro zapnutí/vypnutí zvuku -->

                <svg id="soundOffIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" /></svg>
            </button>
        </div>

        <!-- Záložky s operacemi -->
        <div class="grid grid-cols-4 gap-1.5 p-1 glass-card rounded-2xl text-center font-bold text-sm">
            <button onclick="switchMode('add')" id="btn-add" class="py-2 rounded-xl transition-all bg-indigo-600 text-white shadow-md">Sčítání (+)</button>
            <button onclick="switchMode('sub')" id="btn-sub" class="py-2 rounded-xl transition-all text-slate-400 hover:text-white hover:bg-white/5">Odčítání (−)</button>
            <button onclick="switchMode('mul')" id="btn-mul" class="py-2 rounded-xl transition-all text-slate-400 hover:text-white hover:bg-white/5">Násobení (·)</button>
            <button onclick="switchMode('div')" id="btn-div" class="py-2 rounded-xl transition-all text-slate-400 hover:text-white hover:bg-white/5">Dělení (:)</button>
        </div>
    </header>

    <!-- Hlavní kontejner -->
    <main class="w-full max-w-md my-auto flex flex-col gap-4">

        <!-- Karta s Pokrokem a Tečkami Streaku -->
        <div class="glass-card rounded-2xl p-4 shadow-xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Série (Streak)</span>
                <span id="streakCounter" class="font-display font-extrabold text-amber-400 text-lg">0 / 5 🔥</span>
            </div>
            <!-- Progress Bar -->
            <div class="w-full h-2.5 bg-slate-900/80 rounded-full overflow-hidden p-0.5 border border-slate-700/50 mb-3">
                <div id="progressBar" class="h-full bg-gradient-to-r from-amber-500 via-orange-500 to-emerald-400 rounded-full w-0 transition-all duration-300 ease-out"></div>
            </div>
            <!-- Indikátory / Tečky -->
            <div id="dotsContainer" class="flex justify-between items-center px-1 gap-1">
                <!-- Generuje JS -->
            </div>
        </div>

        <!-- Hlavní hrací karta -->
        <div id="gameCard" class="glass-card rounded-3xl p-5 md:p-7 shadow-2xl relative overflow-hidden transition-transform duration-200">
            
            <!-- Zobrazení Příkladů -->
            <div class="text-center my-2">
                <div class="text-slate-400 text-xs font-medium mb-3 uppercase tracking-wider">Vypočítej a výsledek uveď v základním tvaru:</div>
                <div id="problemDisplay" class="font-display text-3xl md:text-4xl font-extrabold tracking-tight text-white mb-6 flex items-center justify-center gap-3 min-h-[90px]">
                    <!-- Generuje JS -->
                </div>
            </div>

            <!-- Formulář pro Zlomek -->
            <form id="answerForm" onsubmit="event.preventDefault(); submitAnswer();" class="mt-2">
                <div class="flex flex-col items-center gap-4 max-w-xs mx-auto">
                    
                    <!-- Vstupní Pole Zlomku / Čísla -->
                    <div class="flex items-center justify-center gap-3 w-full bg-slate-900/90 p-4 rounded-2xl border-2 border-indigo-500/50 shadow-inner">
                        <span class="text-slate-400 font-bold text-xl">=</span>
                        <div class="flex flex-col items-center gap-1.5 w-32">
                            <input 
                                type="text" 
                                id="numInput" 
                                placeholder="čitatel" 
                                autocomplete="off"
                                inputmode="numeric"
                                autofocus
                                class="w-full text-center text-3xl font-display font-bold py-1 px-2 bg-slate-800/90 border border-slate-600 rounded-xl focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 text-white placeholder-slate-500 transition"
                            />
                            <div class="w-full h-1 bg-indigo-400/80 rounded-full"></div>
                            <input 
                                type="text" 
                                id="denInput" 
                                placeholder="jmenovatel" 
                                autocomplete="off"
                                inputmode="numeric"
                                class="w-full text-center text-3xl font-display font-bold py-1 px-2 bg-slate-800/90 border border-slate-600 rounded-xl focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 text-white placeholder-slate-500 transition"
                            />
                        </div>
                    </div>

                    <button 
                        type="submit" 
                        id="submitBtn"
                        class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold text-lg shadow-lg shadow-indigo-500/25 active:scale-95 transition-all flex items-center justify-center gap-2">
                        <span>Potvrdit (Enter)</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </form>

            <!-- Feedback / Chybová zpráva -->
            <div id="feedbackMessage" class="min-h-[2.5rem] mt-3 text-center flex items-center justify-center font-semibold text-sm">
                <span class="text-slate-400">Pokud je výsledek celé číslo, jmenovatel nevyplňuj.</span>
            </div>
        </div>

    </main>

    <footer class="w-full max-w-md mt-3 text-center text-xs text-slate-400 flex justify-around p-3 glass-card rounded-xl">
        <div>Celkem správně: <span id="statCorrect" class="font-bold text-emerald-400">0</span></div>
        <div>Chyb: <span id="statMistakes" class="font-bold text-rose-400">0</span></div>
        <div>Nejlepší Streak: <span id="statBestStreak" class="font-bold text-amber-400">0</span></div>
    </footer>

    <!-- Gratulační Modal (Výhra) -->

            <div class="w-20 h-20 bg-emerald-500/20 border-2 border-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl shadow-lg shadow-emerald-500/20">
                🏆
            </div>
            <h2 class="font-display text-3xl font-extrabold text-white mb-2">Skvělá práce!</h2>
            <p class="text-slate-300 text-sm mb-6">Dosáhl/a jsi cílového streaku <strong id="winStreakCount" class="text-emerald-400">5 správných odpovědí</strong> v řadě!</p>

                Hrát znovu 🚀

    </div>

        // Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15); // G5
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'win') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const noteOsc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    noteOsc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);
                    noteOsc.type = 'triangle';
                    noteOsc.frequency.setValueAtTime(freq, now + index * 0.1);
                    noteGain.gain.setValueAtTime(0.2, now + index * 0.1);
                    noteGain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.3);
                    noteOsc.start(now + index * 0.1);
                    noteOsc.stop(now + index * 0.1 + 0.3);
                });
            }
        }

            ['add', 'sub', 'mul', 'div'].forEach(m => {

                if (m === mode) {

            });

            modeTitle.textContent = MODE_TITLES[mode];

        // Pomocná funkce pro převod řetězce "a/b" na HTML zlomku
        function formatFractionHTML(str) {
            const parts = str.split(' ');
            if (parts.length === 3) {
                // např "1/2 + 7/12"
                return `${renderSingleFrac(parts[0])} <span class="text-indigo-400 mx-2">${parts[1]}</span> ${renderSingleFrac(parts[2])}`;
            }
            return str;
        }

        function renderSingleFrac(fracStr) {
            if (fracStr.includes('/')) {
                const [num, den] = fracStr.split('/');
                return `<div class="fraction"><span class="fraction-num">${num}</span><span class="fraction-den">${den}</span></div>`;
            }
            return `<span>${fracStr}</span>`;
        }

        // Generování nového příkladu
        function generateProblem() {
            const dataset = DATASETS[currentMode];
            const randomIndex = Math.floor(Math.random() * dataset.length);
            currentProblem = dataset[randomIndex];

            problemDisplay.innerHTML = formatFractionHTML(currentProblem.expr);
            numInput.value = '';
            denInput.value = '';
            focusInput();
        }

        // Automatický focus na čitatele
        function focusInput() {
            setTimeout(() => {
                numInput.focus();
            }, 10);
        }

        // Automatický přechod na jmenovatele po klávese Slash '/' nebo Enter na čitateli
        numInput.addEventListener('keydown', (e) => {
            if (e.key === '/' || e.key === 'Slash') {
                e.preventDefault();
                denInput.focus();
                denInput.select();
            }
        });

        // Vyhodnocení odpovědi
        function submitAnswer() {
            const numVal = numInput.value.trim();
            const denVal = denInput.value.trim();

            if (numVal === '') return;

            let userResult = '';
            if (denVal === '' || denVal === '1') {
                userResult = numVal;
            } else {
                userResult = `${numVal}/${denVal}`;
            }

            if (userResult === currentProblem.ans) {
                handleCorrectAnswer();
            } else {
                handleWrongAnswer();
            }
        }

        function handleCorrectAnswer() {
            playSound('correct');
            currentStreak++;
            stats.correct++;
            
            if (currentStreak > stats.bestStreak) {
                stats.bestStreak = currentStreak;
            }

            triggerFlash('flash-success');
            showFeedback('Správně! ✨', 'text-emerald-400');
            
            updateUI();

            const target = TARGET_STREAKS[currentMode];
            if (currentStreak >= target) {
                setTimeout(triggerWin, 250);
            } else {
                generateProblem();
            }
        }

        // Chybná odpověď
        function handleWrongAnswer() {
            playSound('wrong');
            stats.mistakes++;
            
            const formattedAns = renderSingleFrac(currentProblem.ans);
            showFeedback(`Chyba! Správný výsledek je <div class="inline-flex items-center text-rose-400 font-bold ml-1.5">${formattedAns}</div>`, 'text-rose-400');
            
            // Shake efekt karty
            gameCard.classList.remove('animate-shake');
            void gameCard.offsetWidth; // Reflow
            gameCard.classList.add('animate-shake');

            triggerFlash('flash-error');

            currentStreak = 0;
            updateUI();
            
            numInput.value = '';
            denInput.value = '';
            focusInput();
        }

        // Záblesk pozadí
        function triggerFlash(className) {
            body.classList.remove('flash-success', 'flash-error');
            void body.offsetWidth; // Reflow
            body.classList.add(className);

            setTimeout(() => {
                body.classList.remove(className);
            }, 450);
        }

        // Aktualizace UI
        function updateUI() {
            const target = TARGET_STREAKS[currentMode];
            streakCounter.textContent = `${currentStreak} / ${target} 🔥`;
            
            const percentage = (currentStreak / target) * 100;
            progressBar.style.width = `${percentage}%`;

            // Indikátory
            const dots = dotsContainer.children;
            for (let i = 0; i < target; i++) {
                if (i < currentStreak) {
                    dots[i].className = 'flex-1 h-3 rounded-full bg-emerald-400 shadow-md shadow-emerald-400/50 border border-emerald-300 scale-105 transition-all duration-300';
                } else {
                    dots[i].className = 'flex-1 h-3 rounded-full border border-slate-600 bg-slate-800 transition-all duration-300';
                }
            }

            // Statistiky
            statCorrect.textContent = stats.correct;
            statMistakes.textContent = stats.mistakes;
            statBestStreak.textContent = stats.bestStreak;
        }

        function showFeedback(text, colorClass) {
            feedbackMessage.innerHTML = `<span class="${colorClass}">${text}</span>`;
        }

        // Vítězná obrazovka
        function triggerWin() {
            playSound('win');

            const target = TARGET_STREAKS[currentMode];
            winStreakCount.textContent = `${target} správných odpovědí`;

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }

            winModal.classList.remove('hidden');
            setTimeout(() => {
                winModal.classList.remove('opacity-0');
                winModalCard.classList.remove('scale-90');
                winModalCard.classList.add('scale-100');
            }, 10);
        }

        // Reset hry
        function resetGame(fullReset = false) {
            currentStreak = 0;
            if (fullReset) {
                winModal.classList.add('opacity-0');
                winModalCard.classList.remove('scale-100');
                winModalCard.classList.add('scale-90');
                setTimeout(() => {
                    winModal.classList.add('hidden');
                }, 300);
            }

            showFeedback('Pokud je výsledek celé číslo, jmenovatel nevyplňuj.', 'text-slate-400');
            initDots();
            updateUI();
            generateProblem();
        }

        // Kliknutí mimo pro zachování focusu
        document.addEventListener('click', (e) => {
            if (!e.target.closest('button') && !e.target.closest('input') && winModal.classList.contains('hidden')) {
                focusInput();
            }
        });

        window.onload = () => {
            switchMode('add');
        };
    </script>
</body>
</html>
